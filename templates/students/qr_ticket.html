<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تذكرة QR - {{ student.student_code }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @page {
            size: 80mm 50mm;
            margin: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ticket {
            width: 80mm;
            height: 50mm;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6mm 4mm;
            direction: rtl;
        }

        .ticket-info {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .student-name {
            font-size: 11pt;
            font-weight: 700;
            line-height: 1.3;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .student-code {
            font-size: 16pt;
            font-weight: 700;
            letter-spacing: 2px;
            background: #f0f0f0;
            padding: 2px 12px;
            border-radius: 4px;
            direction: ltr;
        }

        .ticket-qr {
            flex-shrink: 0;
        }

        .ticket-qr img {
            width: 30mm;
            height: 30mm;
            image-rendering: pixelated;
        }

        .no-print {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        @media print {
            body {
                background: #fff;
                min-height: auto;
            }
            .no-print { display: none; }
            .ticket {
                border-color: #000;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button onclick="window.print()" style="padding:10px 30px;font-size:16px;cursor:pointer;font-family:Cairo;border-radius:8px;border:none;background:#667eea;color:#fff;">
            <span>🖨️</span> طباعة التذكرة
        </button>
    </div>

    <div class="ticket">
        <div class="ticket-info">
            <div class="student-name">{{ student.full_name }}</div>
            <div class="student-code">{{ student.student_code }}</div>
        </div>
        <div class="ticket-qr">
            {% if barcode_base64 %}
            <img src="data:image/png;base64,{{ barcode_base64 }}" alt="QR {{ student.student_code }}">
            {% endif %}
        </div>
    </div>
</body>
</html>
