<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام مغلق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1c23 0%, #2d1b3d 50%, #1a1c23 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ff6b6b;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .highlight {
            color: #ffd93d;
            font-weight: 600;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            margin: 30px auto;
            border-radius: 2px;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 30px;
        }

        .phone-link {
            display: inline-block;
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #4ecdc4;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .phone-link:hover {
            color: #ffd93d;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">🔒</span>
        <h1>النظام مغلق مؤقتاً</h1>
        <div class="divider"></div>
        <p>تم تعليق الوصول إلى النظام</p>
        <p class="highlight">لحين دفع الأموال المستحقة</p>
        <div class="divider"></div>
        <p class="footer-text">للتواصل والدعم الفني يرجى الاتصال بالإدارة</p>
        <a href="tel:01227853003" class="phone-link">📞 01227853003</a>
    </div>
</body>
</html>
