version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: educore_db
    environment:
      POSTGRES_DB: ${DB_NAME:-educore}
      POSTGRES_USER: ${DB_USER:-educore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-educore123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-educore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educore_network

  # ==========================================
  # Redis Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: educore_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educore_network

  # ==========================================
  # Django Web Application
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educore_web
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/accounts/login/', timeout=5); exit(0) if r.status_code == 200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - educore_network

  # ==========================================
  # Celery Worker
  # ==========================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educore_celery_worker
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - educore_network
    restart: unless-stopped

  # ==========================================
  # Celery Beat (Scheduler)
  # ==========================================
    healthcheck:
      # The image-level HEALTHCHECK in the Dockerfile asks an HTTP endpoint on
      # localhost:8000, which only the web container serves. Celery inherited
      # it and could therefore never report healthy — it sat "unhealthy" for
      # weeks while working perfectly, which is worse than no healthcheck at
      # all: a real worker outage looked exactly like the false alarm.
      # ``inspect ping`` asks the worker itself and is the honest signal.
      test: ["CMD-SHELL", "celery -A config inspect ping 2>/dev/null | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educore_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - logs_volume:/app/logs
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - educore_network
    restart: unless-stopped

  # ==========================================
  # Nginx Reverse Proxy (Production)
  # ==========================================
    healthcheck:
      # Beat answers no ping (it dispatches, it does not consume), and the
      # image has neither ps nor pgrep, so a process check is not available.
      # This asks the question that actually matters — is the schedule still
      # being dispatched? — which also catches a beat that is alive but stuck.
      test: ["CMD-SHELL", "python -c \"import os,django;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');django.setup();from datetime import timedelta;from django.utils import timezone;from django_celery_beat.models import PeriodicTask;raise SystemExit(0 if PeriodicTask.objects.filter(enabled=True, last_run_at__gte=timezone.now()-timedelta(minutes=15)).exists() else 1)\" 2>/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:alpine
    container_name: educore_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "1999:1999"
    depends_on:
      - web
    networks:
      - educore_network
    restart: unless-stopped

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  educore_network:
    driver: bridge
